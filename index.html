<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบลงเวลาทำงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f3;--sf:#fff;--ink:#12262c;--mut:#5b6e74;--ln:#d5dee1;--ac:#0e7467;--acf:#fff;--warn:#9a4a05;--warnb:#fdf0dc;--bad:#b42318;--badb:#fde6e3;--ok:#0b6b5f;--okb:#dcf3ee;--hol:#5b3fb5;--holb:#ece8fa;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1e;--sf:#16262b;--ink:#e6f0f2;--mut:#9ab0b6;--ln:#294047;--ac:#38b6a5;--acf:#06201c;--warn:#f0a95a;--warnb:#3a2a12;--bad:#f28b82;--badb:#3d1a17;--ok:#5fd0bf;--okb:#12332e;--hol:#b9a6f5;--holb:#2a2250;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a1e;--sf:#16262b;--ink:#e6f0f2;--mut:#9ab0b6;--ln:#294047;--ac:#38b6a5;--acf:#06201c;--warn:#f0a95a;--warnb:#3a2a12;--bad:#f28b82;--badb:#3d1a17;--ok:#5fd0bf;--okb:#12332e;--hol:#b9a6f5;--holb:#2a2250;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
nav button,.seg button{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer;white-space:nowrap}
nav button.on,.seg button.on{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:500}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
.wide{overflow-x:auto}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;width:100%;min-height:42px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.btn{border:0;background:var(--ac);color:var(--acf);padding:10px 18px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer;min-height:42px}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn.del{background:transparent;color:var(--bad);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.clock{font-size:clamp(52px,16vw,96px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.date{color:var(--mut);margin-bottom:12px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.step{border:1px solid var(--ln);border-radius:10px;padding:10px 6px;text-align:center;font-size:14px;color:var(--mut)}
.step b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.step.done{background:var(--okb);border-color:transparent}.step.done b{color:var(--ok)}
.step.next{border:2px solid var(--ac);color:var(--ink)}
.big{width:100%;font-size:19px;padding:16px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mut);font-weight:500}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.pick{cursor:pointer}tr.pick:hover td{background:var(--bg)}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:13px;margin-right:4px}
.c-late{background:var(--warnb);color:var(--warn)}.c-bad{background:var(--badb);color:var(--bad)}.c-ok{background:var(--okb);color:var(--ok)}.c-hol{background:var(--holb);color:var(--hol)}.c-off{background:var(--bg);color:var(--mut)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.row{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.row>div{flex:1 1 150px}
.note{color:var(--mut);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<main>
<header><h1>ระบบลงเวลาทำงาน</h1><button class="btn sec" id="mb" onclick="mgrBtn()"></button></header>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=m=>m==null?'–':pad(Math.floor(m/60))+':'+pad(m%60);
const tm=s=>{const a=s.split(':');return +a[0]*60+ +a[1]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+Math.round(n).toLocaleString('th-TH');
const DAYS=['อา','จ','อ','พ','พฤ','ศ','ส'],KEYS=['in','bo','be','out'],LAB=['เข้างาน','ออกพัก','กลับจากพัก','เลิกงาน'];
const KEY='timeclock-demo-v2',T=dstr(new Date());
const WK=(days,st,en)=>[0,1,2,3,4,5,6].map(w=>({on:days.includes(w),st:st,en:en}));
let S,ui={tab:'punch',emp:null,per:'week',date:T,detail:null,edit:null,sim:false,simv:''};

function seed(){
  let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;
  const emps=[
    {id:'E001',name:'สมชาย ใจดี',phone:'081-234-5678',type:'full',rate:18000,st:'09:00',en:'18:00',br:60,sch:WK([1,2,3,4,5],'09:00','18:00')},
    {id:'E002',name:'มาลี รักงาน',phone:'082-345-6789',type:'full',rate:15000,st:'09:00',en:'18:00',br:60,sch:WK([1,2,3,4,5],'09:00','18:00')},
    {id:'P001',name:'ต้น เรียนดี',phone:'083-456-7890',type:'part',rate:60,st:'12:00',en:'20:00',br:30,sch:WK([2,4,5,6,0],'12:00','20:00')},
    {id:'P002',name:'ฟ้า สดใส',phone:'084-567-8901',type:'part',rate:55,st:'10:00',en:'16:00',br:30,sch:WK([1,3,6,0],'10:00','16:00')}];
  const hol={'2026-10-13':'วันนวมินทรมหาราช','2026-10-23':'วันปิยมหาราช','2026-12-07':'ชดเชยวันพ่อแห่งชาติ','2026-12-10':'วันรัฐธรรมนูญ','2026-12-31':'วันสิ้นปี'};
  const rec={};
  for(let i=14;i>=1;i--){
    const dt=new Date();dt.setDate(dt.getDate()-i);const d=dstr(dt),w=dt.getDay(),h=hol[d];
    emps.forEach(e=>{
      let work;
      const sc=e.sch[w];work=sc.on?R()>(h&&e.type==='full'?.7:.08):R()<.05;
      if(!work)return;
      const st=tm(sc.st),en=tm(sc.en),mid=Math.round((st+en)/2-e.br/2+R()*8);
      const inn=st+Math.round(R()*R()*28-4),bo=mid;
      rec[e.id+'|'+d]={in:inn,bo:bo,be:bo+e.br+(R()<.25?Math.round(R()*18):0),out:en+Math.round(R()*20-6)};
    });
  }
  return {emps,rec,hol,ovr:{},leave:[],audit:[],notif:[],pin:'1234',set:{grace:5,pm:2,fx:1}};
}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);S.leave=S.leave||[];S.audit=S.audit||[];S.notif=S.notif||[];S.pin=S.pin||'1234';fixTok();return}}catch(e){}S=seed();fixTok()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const emp=id=>S.emps.find(e=>e.id===id);
function now(){if(ui.sim&&ui.simv){const d=new Date(ui.simv);if(!isNaN(d))return d}return new Date()}
function toast(t){const x=$('#toast');x.textContent=t;x.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>x.className='',2800)}

function sched(e,d){const o=S.ovr[e.id+'|'+d];if(o)return o.off?null:{st:o.st,en:o.en};const w=new Date(d+'T00:00:00').getDay();if(S.hol[d]&&e.type==='full')return null;const s=e.sch[w];return s&&s.on?{st:s.st,en:s.en}:null}
function dayInfo(e,d){
  const r=S.rec[e.id+'|'+d],w=new Date(d+'T00:00:00').getDay(),hol=S.hol[d],sc=sched(e,d);
  const o={d,w,hol,r,sc,late:0,brk:0,early:0,net:0,abs:false,work:false};
  if(r&&r.in!=null){
    o.work=true;const l=sc?r.in-tm(sc.st):0;if(l>S.set.grace)o.late=l;
    const hb=r.bo!=null&&r.be!=null;
    if(hb){const b=(r.be-r.bo)-e.br;if(b>0)o.brk=b}
    if(r.out!=null){const x=sc?tm(sc.en)-r.out:0;if(x>0)o.early=x;o.net=(r.out-r.in)-(hb?r.be-r.bo:0)}
  }else if(sc){const n=new Date();if(d<T||(d===T&&n.getHours()*60+n.getMinutes()>tm(sc.en)))o.abs=true}
  return o;
}
function range(){
  const b=new Date(ui.date+'T00:00:00');let a,z;
  if(ui.per==='day')a=z=b;
  else if(ui.per==='week'){a=new Date(b);a.setDate(b.getDate()-(b.getDay()+6)%7);z=new Date(a);z.setDate(a.getDate()+6)}
  else{a=new Date(b.getFullYear(),b.getMonth(),1);z=new Date(b.getFullYear(),b.getMonth()+1,0)}
  const o=[];for(let x=new Date(a);x<=z;x.setDate(x.getDate()+1))o.push(dstr(x));return o;
}
function stats(e,ds){
  const t={days:0,lateN:0,lateM:0,brk:0,early:0,abs:0,holD:0,min:0,nm:0,hm:0};
  ds.forEach(d=>{const i=dayInfo(e,d);
    if(i.work){t.days++;t.min+=i.net;if(i.late){t.lateN++;t.lateM+=i.late}t.brk+=i.brk;t.early+=i.early;
      if(i.hol){t.holD++;t.hm+=i.net}else t.nm+=i.net}
    if(i.abs)t.abs++});
  t.pay=e.type==='part'?t.nm/60*e.rate+t.hm/60*e.rate*S.set.pm:e.rate/30*t.holD*S.set.fx;
  return t;
}
const hrs=m=>(m/60).toFixed(1);
const schTxt=e=>{const g={};e.sch.forEach((s,w)=>{if(s.on){const k=s.st+'–'+s.en;(g[k]=g[k]||[]).push(DAYS[w])}});const k=Object.keys(g);return k.length?k.map(t=>g[t].join(' ')+' '+t).join(' · '):'ไม่มีกะ'};

function nav(){
  const t=ui.mgr?[['sch','ตารางงาน'],['fix','แก้เวลา'],['report','รายงาน'],['emps','พนักงาน'],['cards','บัตร QR'],['lva','อนุมัติลา'],['nt','แจ้งเตือน LINE'],['set','ตั้งค่า']]:[['punch','สแกนเวลา'],['qr','QR ของฉัน'],['sch','ตารางงาน'],['leave','ขอลา']];$('#mb').textContent=ui.mgr?'ออกจาก J9MODE':'J9MODE';
  $('#nav').innerHTML=t.map(x=>`<button class="${ui.tab===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');
}
function go(t){ui.tab=t;ui.edit=null;render()}
function render(){const MG=['fix','report','emps','set','lva','nt','cards'];if(MG.includes(ui.tab)&&!ui.mgr)ui.tab='punch';if(ui.mgr&&ui.tab==='punch')ui.tab='sch';if(ui.tab!=='punch')stopCam();nav();({punch:vPunch,sch:vSch,report:vReport,emps:vEmps,set:vSet,login:vLogin,qr:vQr,cards:vCards,leave:vLeave,fix:vFix,lva:vLva,nt:vNt})[ui.tab]()}

const rtok=()=>Math.random().toString(36).slice(2,10);
function fixTok(){let c=0;S.emps.forEach(e=>{if(!e.tok){e.tok=rtok();c=1}});if(c)save()}
const qrText=e=>`TC:${e.id}:${e.tok}`;
function qrSvg(t,px){if(!window.qrcode)return `<p class='note'>โหลดตัวสร้าง QR ไม่ได้</p>`;const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount();let p='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+4},${r+4}h1v1h-1z`;return `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${n+8} ${n+8}' width='${px}' height='${px}' style='max-width:100%;height:auto' shape-rendering='crispEdges'><rect width='100%' height='100%' fill='#fff'/><path d='${p}' fill='#000'/></svg>`}
const cam={s:null,t:0};
function stopCam(){clearTimeout(cam.t);if(cam.s){cam.s.getTracks().forEach(x=>x.stop());cam.s=null}}
async function startCam(){
  stopCam();const v=$('#cam'),x=$('#camx');if(!v)return;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw 0;
    cam.s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    v.srcObject=cam.s;await v.play();x.style.display='none';
    const c=document.createElement('canvas'),g=c.getContext('2d',{willReadFrequently:true});
    const loop=()=>{if(!cam.s)return;if(v.videoWidth){const k=Math.min(1,640/v.videoWidth);c.width=v.videoWidth*k;c.height=v.videoHeight*k;g.drawImage(v,0,0,c.width,c.height);const im=g.getImageData(0,0,c.width,c.height),q=window.jsQR&&jsQR(im.data,im.width,im.height);if(q&&q.data)handleScan(q.data)}cam.t=setTimeout(loop,200)};
    loop();
  }catch(err){x.style.display='flex';x.textContent='เปิดกล้องไม่ได้ (อาจยังไม่ได้อนุญาตหรือเบราว์เซอร์บล็อก) ใช้เครื่องสแกน USB หรือพิมพ์รหัสแทน'}
}
function handleScan(raw){
  raw=String(raw||'').trim();if(!raw)return;const nw=Date.now();
  if(ui.lc&&ui.lc.c===raw&&nw-ui.lc.t<4000)return;ui.lc={c:raw,t:nw};
  const p=raw.split(':'),e=p[0]==='TC'?S.emps.find(x=>x.id===p[1]&&x.tok===p[2]):null;
  if(!e){ui.res={bad:1,text:'QR ไม่ถูกต้องหรือถูกยกเลิกแล้ว'};kUpd();return}
  ui.cd=ui.cd||{};const w=30000-(nw-(ui.cd[e.id]||0));
  if(!ui.sim&&w>0){ui.res={id:e.id,text:'เพิ่งสแกนไป รออีก '+Math.ceil(w/1000)+' วินาที',ok:false};kUpd();return}
  ui.cd[e.id]=nw;punch(e);
}
function kTest(){const e=emp($('#ts').value);if(e)handleScan(qrText(e))}
function kUpd(){
  const n=now(),d=dstr(n),r=ui.res,kr=$('#kres'),kc=$('#krec');if(!kr)return;
  $('#clk').textContent=hm(n.getHours()*60+n.getMinutes());$('#kd').textContent=DAYS[n.getDay()]+' '+d+(S.hol[d]?' · '+S.hol[d]:'');
  if(!r)kr.innerHTML=`<p class='note' style='margin-top:12px'>ให้พนักงานแสดง QR ของตัวเองหน้ากล้อง หรือยิงผ่านเครื่องสแกน USB ผลลงเวลาจะขึ้นที่นี่ พร้อมรูปและชื่อ ให้ผู้ดูแลร้านตรวจว่าตรงคน</p>`;
  else if(r.bad)kr.innerHTML=`<div style='text-align:center;margin-top:12px'><span class='chip c-bad' style='font-size:16px;padding:4px 14px'>${esc(r.text)}</span></div>`;
  else{const e=emp(r.id),x=S.rec[e.id+'|'+d]||{};kr.innerHTML=`<div style='text-align:center'>${av(e,96)}<h2 style='margin:8px 0 6px'>${esc(e.name)}</h2><span class='chip ${r.ok?'c-ok':'c-bad'}' style='font-size:16px;padding:4px 14px'>${esc(r.text)}</span><div class='steps'>${KEYS.map((k,i)=>`<div class='step ${x[k]!=null?'done':''}'>${LAB[i]}<b>${hm(x[k])}</b></div>`).join('')}</div></div>`}
  const rows=[];S.emps.forEach(e=>{const x=S.rec[e.id+'|'+d];if(x)KEYS.forEach((k,i)=>{if(x[k]!=null)rows.push({m:x[k],e,l:LAB[i]})})});rows.sort((a,b)=>b.m-a.m);
  kc.innerHTML=rows.length?`<div class='wide'><table>${rows.slice(0,10).map(q=>`<tr><td>${hm(q.m)}</td><td>${dot(q.e)}${esc(q.e.name)}</td><td>${q.l}</td></tr>`).join('')}</table></div>`:`<p class='note'>ยังไม่มีการสแกนวันนี้</p>`;
}
function vPunch(){
  ui.res=null;const n=now();
  $('#view').innerHTML=`<div class='card'><div class='clock' id='clk'></div><div class='date' id='kd'></div>
  <div class='grid' style='grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start'>
   <div><div style='background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;position:relative'><video id='cam' playsinline muted style='width:100%;height:100%;object-fit:cover'></video><div id='camx' style='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:16px'>กล้องปิดอยู่</div></div><div style='margin-top:12px'><button class='btn' onclick='startCam()'>เปิดกล้องสแกน</button></div></div>
   <div id='kres'></div></div>
  <div style='margin-top:16px'><label for='sc'>เครื่องสแกน USB / พิมพ์รหัส (กด Enter)</label><input id='sc' autocomplete='off' placeholder='TC:…'></div></div>
  <div class='card'><h2>สแกนล่าสุดวันนี้</h2><div id='krec'></div></div>
  <div class='card'><label for='ts'>ทดสอบโดยไม่ใช้กล้อง: จำลองการสแกน QR ของ</label><div class='row'><div><select id='ts'>${S.emps.map(x=>`<option value='${esc(x.id)}'>${esc(x.name)}</option>`).join('')}</select></div><div style='flex:0 0 auto'><button class='btn sec' onclick='kTest()'>จำลองสแกน</button></div></div>
  <label><input type='checkbox' style='width:auto;min-height:0' ${ui.sim?'checked':''} onchange='ui.sim=this.checked;if(ui.sim&&!ui.simv)ui.simv=dstr(new Date())+"T09:00";vPunch()'> จำลองวันและเวลา (ไว้ทดสอบสาย/วันหยุด และข้ามช่วงรอ 30 วินาที)</label>${ui.sim?`<input type='datetime-local' value='${ui.simv}' onchange='ui.simv=this.value;kUpd()'>`:''}</div>`;
  $('#sc').addEventListener('keydown',ev=>{if(ev.key==='Enter'){handleScan(ev.target.value);ev.target.value=''}});
  kUpd();
}
function vQr(){
  if(!emp(ui.emp))ui.emp=S.emps[0]&&S.emps[0].id;const e=emp(ui.emp);
  if(!e){$('#view').innerHTML=`<div class='card'>ยังไม่มีพนักงาน</div>`;return}
  $('#view').innerHTML=`<div class='card' style='max-width:420px;text-align:center'><label for='who' style='text-align:left'>พนักงาน (ระบบจริงจะล็อกอิน LINE และเห็นเฉพาะของตัวเอง)</label><select id='who' onchange='ui.emp=this.value;vQr()'>${S.emps.map(x=>`<option value='${esc(x.id)}' ${x.id===e.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>

  S.audit.unshift({t:ts(),emp:e.id,d,old:KEYS.map(x=>old[x]==null?null:old[x]),nw:v,why});
  if(v.every(x=>x==null))delete S.rec[k];else{const r={};KEYS.forEach((x,i)=>r[x]=v[i]);S.rec[k]=r}
  notify(e.id,`HR แก้ไขเวลาลงเวลาวันที่ ${d} เป็น ${v.map(m=>hm(m)).join(' / ')} (${why})`);save();vFix();toast('บันทึกและเก็บประวัติการแก้ไขแล้ว');
}
function vLeave(){
  if(!emp(ui.emp))ui.emp=S.emps[0]&&S.emps[0].id;const e=emp(ui.emp);
  if(!e){$('#view').innerHTML=`<div class='card'>ยังไม่มีพนักงาน</div>`;return}
  const min=addD(T,7),mine=S.leave.filter(l=>l.emp===e.id).slice().reverse(),mn=S.notif.filter(n=>n.emp===e.id).slice(0,8);
  $('#view').innerHTML=`<div class='card'><h2>ขอลา / ขอหยุด</h2><label for='who'>พนักงาน</label><select id='who' onchange='ui.emp=this.value;vLeave()'>${S.emps.map(x=>`<option value='${esc(x.id)}' ${x.id===e.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
  <div class='row' style='margin-top:12px'><div><label>วันที่ต้องการหยุด (ขอล่วงหน้าอย่างน้อย 7 วัน)</label><input id='ld' type='date' min='${min}' value='${min}'></div><div><label>เหตุผล</label><input id='lr'></div></div>
  <button class='btn' onclick='sendLeave()'>ส่งคำขอ</button><p class='note'>เร็วที่สุดที่ขอได้: ${min} · กรณีด่วนกว่านี้ให้แจ้ง HR/ผู้จัดการโดยตรง</p></div>
  <div class='card'><h2>คำขอของฉัน</h2>${mine.length?`<div class='wide'><table><tr><th>วันที่ลา</th><th>เหตุผล</th><th>ขอเมื่อ</th><th>สถานะ</th></tr>${mine.map(l=>`<tr><td>${l.d}</td><td>${esc(l.why)}</td><td>${l.req}</td><td><span class='chip ${LS[l.s][1]}'>${LS[l.s][0]}</span></td></tr>`).join('')}</table></div>`:`<p class='note'>ยังไม่มีคำขอ</p>`}</div>
  <div class='card'><h2>แจ้งเตือนถึงฉัน</h2>${mn.length?mn.map(n=>`<p style='margin:0 0 8px'><span class='note'>${n.t}</span><br>${esc(n.text)}</p>`).join(''):`<p class='note'>ยังไม่มีแจ้งเตือน</p>`}</div>`;
}
function sendLeave(){
  const e=emp(ui.emp),d=$('#ld').value,why=$('#lr').value.trim(),min=addD(T,7);
  if(!d||!why){toast('เลือกวันที่และใส่เหตุผล');return}
  if(d<min){toast('ต้องขอล่วงหน้าอย่างน้อย 7 วัน (เร็วสุด '+min+')');return}
  if(S.leave.some(l=>l.emp===e.id&&l.d===d&&l.s!=='rejected')){toast('มีคำขอวันนี้อยู่แล้ว');return}
  S.leave.push({id:Date.now(),emp:e.id,d,why,s:'pending',req:T});save();vLeave();toast('ส่งคำขอแล้ว รอ HR/ผู้จัดการอนุมัติ');
}
function vLva(){
  const P=S.leave.filter(l=>l.s==='pending').sort((a,b)=>a.d<b.d?-1:1),H=S.leave.filter(l=>l.s!=='pending').slice().reverse().slice(0,30);
  $('#view').innerHTML=`<div class='card'><h2>คำขอลารออนุมัติ (${P.length})</h2>${P.length?`<div class='wide'><table><tr><th>พนักงาน</th><th>วันที่ลา</th><th>เหตุผล</th><th>ขอเมื่อ</th><th></th></tr>${P.map(l=>`<tr><td>${nm(l.emp)}</td><td>${l.d}</td><td>${esc(l.why)}</td><td>${l.req}</td><td><button class='btn' onclick='decide(${l.id},true)'>อนุมัติ</button> <button class='btn del' onclick='decide(${l.id},false)'>ไม่อนุมัติ</button></td></tr>`).join('')}</table></div>`:`<p class='note'>ไม่มีคำขอค้างอยู่ (ลองสลับไปโหมดพนักงาน แล้วขอลาที่แท็บ “ขอลา”)</p>`}<p class='note'>เมื่ออนุมัติ ระบบจะตั้งวันนั้นเป็น “ลา” ในตารางงานและไม่นับขาด</p></div>
  <div class='card'><h2>ประวัติ</h2>${H.length?`<div class='wide'><table>${H.map(l=>`<tr><td>${nm(l.emp)}</td><td>${l.d}</td><td>${esc(l.why)}</td><td><span class='chip ${LS[l.s][1]}'>${LS[l.s][0]}</span></td></tr>`).join('')}</table></div>`:`<p class='note'>ยังไม่มี</p>`}</div>`;
}
function decide(id,ok){const l=S.leave.find(x=>x.id===id);if(!l)return;l.s=ok?'approved':'rejected';if(ok)S.ovr[l.emp+'|'+l.d]={off:true,leave:true};notify(l.emp,`คำขอลาวันที่ ${l.d} ${ok?'ได้รับอนุมัติแล้ว':'ไม่ได้รับอนุมัติ'}`);save();vLva()}
function vNt(){
  $('#view').innerHTML=`<div class='card'><h2>แจ้งเตือนผ่าน LINE</h2><p>ต้นแบบนี้ยังส่งเข้า LINE จริงไม่ได้ (เป็นหน้าเว็บล้วน ไม่มีเซิร์ฟเวอร์) ตารางด้านล่างคือข้อความที่ระบบจะส่งเมื่อมีการเปลี่ยนตาราง แก้เวลา หรืออนุมัติ/ไม่อนุมัติลา ส่วนพนักงานจะเห็นข้อความเดียวกันที่แท็บ “ขอลา”</p><p class='note'>ระบบจริงต้องมี LINE Official Account (Messaging API) และให้พนักงานล็อกอินผ่าน LINE (LIFF) ครั้งแรกเพื่อผูก LINE User ID กับรหัสพนักงาน หรือกรอก ID ที่แท็บ “พนักงาน”</p></div>
  <div class='card'><h2>กล่องข้อความที่จะส่ง</h2>${S.notif.length?`<div class='wide'><table><tr><th>เวลา</th><th>ถึง</th><th>LINE</th><th>ข้อความ</th></tr>${S.notif.slice(0,50).map(n=>`<tr><td>${n.t}</td><td>${nm(n.emp)}</td><td>${emp(n.emp)&&emp(n.emp).line?`<span class='chip c-ok'>ผูกแล้ว</span>`:`<span class='chip c-off'>ยังไม่ผูก</span>`}</td><td style='white-space:normal'>${esc(n.text)}</td></tr>`).join('')}</table></div>`:`<p class='note'>ยังไม่มีข้อความ ลองแก้ตาราง/เวลา หรืออนุมัติลา แล้วกลับมาดู</p>`}</div>`;
}
function vEmps(){if(!ui.edit)ui.ph=undefined;
  const x=ui.edit,f=x?`<div class="card"><h2>${x.id?'แก้ไขพนักงาน':'เพิ่มพนักงาน'}</h2><div class="grid">
   <div><label>ชื่อ</label><input id="f_name" value="${esc(x.name||'')}"></div>
   <div><label>รหัสพนักงาน</label><input id="f_id" value="${esc(x.id||'')}" ${x.id?'readonly':''}></div>
   <div><label>เบอร์โทร</label><input id="f_phone" value="${esc(x.phone||'')}"></div><div><label>สีประจำตัว</label><input id="f_color" type="color" value="${x.color||'#0e7467'}" style="padding:2px"></div><div><label>LINE User ID (ไว้ผูกแจ้งเตือน)</label><input id="f_line" value="${esc(x.line||'')}" placeholder="U1234…"></div><div><label>รูปพนักงาน</label><div style="display:flex;gap:10px;align-items:center"><span id="ph_pv">${av({name:x.name||'?',color:x.color,ph:ui.ph!==undefined?ui.ph:x.ph},44)}</span><input type="file" accept="image/*" onchange="pickPhoto(this)"></div></div>
   <div><label>ประเภท</label><select id="f_type"><option value="full" ${x.type!=='part'?'selected':''}>ประจำ (รายเดือน)</option><option value="part" ${x.type==='part'?'selected':''}>พาร์ทไทม์ (รายชั่วโมง)</option></select></div>
   <div><label>เงินเดือน / ค่าแรงต่อชั่วโมง (บาท)</label><input id="f_rate" type="number" min="0" value="${x.rate||''}"></div>
   
   
   <div><label>เวลาพัก (นาที)</label><input id="f_br" type="number" min="0" value="${x.br==null?60:x.br}"></div></div>
   <h2 style="margin:20px 0 8px">ตารางงานประจำสัปดาห์ (เวลาเข้างานคือเกณฑ์ตัดสินว่าสาย)</h2>${(x.sch||WK([1,2,3,4,5],'09:00','18:00')).map((s,w)=>`<div class="row" style="margin-bottom:6px"><div style="flex:0 0 70px"><label style="display:flex;gap:6px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto;min-height:0" id="s_on${w}" ${s.on?'checked':''}>${DAYS[w]}</label></div><div><input type="time" id="s_st${w}" value="${s.st}"></div><div><input type="time" id="s_en${w}" value="${s.en}"></div></div>`).join('')}
   <div class="row" style="margin:16px 0 0"><button class="btn" onclick="saveEmp()">บันทึก</button><button class="btn sec" onclick="ui.edit=null;vEmps()">ยกเลิก</button></div></div>`:'';
  $('#view').innerHTML=`<div class="card"><div class="row" style="margin:0"><h2 style="flex:1;margin:0">พนักงาน ${S.emps.length} คน</h2><button class="btn" onclick="ui.edit={};vEmps()">เพิ่มพนักงาน</button></div>
   <div class="wide"><table><tr><th>รหัส</th><th>ชื่อ</th><th>ประเภท</th><th>เบอร์โทร</th><th>กะ</th><th class="n">ค่าจ้าง</th><th></th></tr>
   ${S.emps.map(e=>`<tr><td>${esc(e.id)}</td><td>${av(e,32)} ${esc(e.name)}</td><td>${e.type==='full'?'ประจำ':'พาร์ทไทม์'}</td><td>${esc(e.phone)}</td><td>${schTxt(e)} (พัก ${e.br})</td><td class="n">${baht(e.rate)}${e.type==='full'?'/เดือน':'/ชม.'}</td><td><button class="btn sec" onclick="ui.edit=emp('${esc(e.id)}');vEmps()">แก้ไข</button> <button class="btn del" onclick="delEmp('${esc(e.id)}')">ลบ</button></td></tr>`).join('')}
   </table></div><p class="note">ระบบจริง: พนักงานเห็นเฉพาะข้อมูลตัวเอง หัวหน้า/HR เห็นทุกคน และต้องขอความยินยอมตาม PDPA</p></div>${f}`;
}
function saveEmp(){
  const v=k=>$('#f_'+k).value.trim(),id=v('id'),name=v('name');
  if(!id||!name||!v('rate')){toast('กรอกชื่อ รหัส และค่าจ้างให้ครบ');return}
  const sch=[0,1,2,3,4,5,6].map(w=>({on:$('#s_on'+w).checked,st:$('#s_st'+w).value||'09:00',en:$('#s_en'+w).value||'18:00'})),o={id,name,phone:v('phone'),line:v('line'),color:v('color'),ph:ui.ph!==undefined?ui.ph:(ui.edit.ph||''),type:v('type'),rate:+v('rate'),sch,br:+v('br')||0,tok:ui.edit.tok||rtok()},i=S.emps.findIndex(e=>e.id===id);
  if(ui.edit.id){if(JSON.stringify(ui.edit.sch)!==JSON.stringify(sch)||ui.edit.br!==o.br)notify(id,'ตารางงานประจำสัปดาห์ของคุณมีการเปลี่ยนแปลง กรุณาตรวจสอบในแอป');S.emps[i]=o}else if(i>=0){toast('รหัสนี้มีอยู่แล้ว');return}else S.emps.push(o);
  save();ui.edit=null;vEmps();toast('บันทึกแล้ว');
}
function delEmp(id){if(!confirm('ลบพนักงานคนนี้? ประวัติลงเวลาจะไม่แสดงในรายงาน'))return;S.emps=S.emps.filter(e=>e.id!==id);save();vEmps()}

function vSet(){
  const hs=Object.keys(S.hol).sort();
  $('#view').innerHTML=`<div class="card"><h2>เกณฑ์การคำนวณ</h2><div class="grid">
   <div><label>ผ่อนผันมาสาย (นาที)</label><input type="number" min="0" value="${S.set.grace}" onchange="S.set.grace=+this.value||0;save()"></div>
   <div><label>ตัวคูณค่าแรงพาร์ทไทม์วันหยุด</label><input type="number" step="0.5" min="1" value="${S.set.pm}" onchange="S.set.pm=+this.value||1;save()"></div>
   <div><label>ส่วนเพิ่มพนักงานประจำวันหยุด (เท่าของค่าแรงรายวัน)</label><input type="number" step="0.5" min="0" value="${S.set.fx}" onchange="S.set.fx=+this.value||0;save()"></div></div>
   <p class="note">เรตตามกฎหมายแรงงานต่างกันระหว่างรายเดือนกับรายวัน/รายชั่วโมง ค่าเริ่มต้นเป็นเพียงตัวอย่าง ตรวจกับฝ่ายบัญชีก่อนใช้จริง</p></div>
  <div class="card"><h2>วันนักขัตฤกษ์ / วันหยุดบริษัท</h2>
   <div class="row"><div><label>วันที่</label><input id="h_d" type="date"></div><div><label>ชื่อวันหยุด</label><input id="h_n"></div><div style="flex:0 0 auto"><button class="btn" onclick="addHol()">เพิ่ม</button></div></div>
   <div class="wide"><table>${hs.map(d=>`<tr><td>${d}</td><td>${esc(S.hol[d])}</td><td><button class="btn del" onclick="delete S.hol['${d}'];save();vSet()">ลบ</button></td></tr>`).join('')}</table></div>
   <p class="note">รายการตัวอย่าง ตรวจกับปฏิทินวันหยุดที่ประกาศจริงก่อนใช้งาน</p></div>
  <div class="card"><h2>PIN สำหรับ HR/ผู้จัดการ</h2><div class="row"><div><label>PIN ใหม่ (อย่างน้อย 4 ตัว)</label><input id="np" type="password" inputmode="numeric"></div><div style="flex:0 0 auto"><button class="btn" onclick="savePin()">บันทึก</button></div></div><p class="note">PIN เก็บในเบราว์เซอร์ ใช้กันคนทั่วไปเข้าผิดหน้าในต้นแบบเท่านั้น ระบบจริงต้องล็อกอินและตรวจสิทธิ์ที่เซิร์ฟเวอร์</p></div>
  <div class="card"><button class="btn sec" onclick="if(confirm('ล้างข้อมูลทั้งหมดและกลับไปใช้ข้อมูลตัวอย่าง?')){S=seed();save();go('punch')}">รีเซ็ตเป็นข้อมูลตัวอย่าง</button></div>`;
}
function addHol(){const d=$('#h_d').value,n=$('#h_n').value.trim();if(!d||!n){toast('ใส่วันที่และชื่อวันหยุด');return}S.hol[d]=n;save();vSet()}

load();render();
setInterval(()=>{const c=$('#clk');if(c&&!ui.sim){const n=new Date();c.textContent=hm(n.getHours()*60+n.getMinutes())}},5000);
</script>
</body>
</html>
